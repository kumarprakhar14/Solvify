<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="linkGradientH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glowH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* 1. Base Styles (Default for LIGHT MODE) */
      /* We define classes for the text elements */
      .brand-text { 
          font-family: 'Poppins', 'Montserrat', sans-serif; 
          font-weight: 800; 
          fill: #1F2937; /* Dark Gray/Black for light backgrounds */
      }
      .tagline-text { 
          font-family: 'Poppins', 'Montserrat', sans-serif; 
          font-weight: 500; 
          fill: #6B7280; /* Medium Gray for light backgrounds */
          letter-spacing: 0.5px; 
      }

      /* 2. The Override (For DARK MODE) */
      /* The browser checks if the user prefers dark mode. If yes, it applies these rules. */
      @media (prefers-color-scheme: dark) {
        .brand-text { 
            fill: #F9FAFB; /* Switch to Off-White */
        }
        .tagline-text { 
            fill: #D1D5DB; /* Switch to Light Gray */
        }
      }
    </style>
  </defs>

  <g transform="translate(10, 10)">
      <path d="M30,10 C21.7157,10 15,16.7157 15,25 C15,33.2843 21.7157,40 30,40 L40,40 C45.5228,40 50,35.5228 50,30 C50,24.4772 45.5228,20 40,20 L30,20 C27.2386,20 25,22.2386 25,25 C25,27.7614 27.2386,30 30,30 L35,30" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" />
      <path d="M60,50 C68.2843,50 75,43.2843 75,35 C75,26.7157 68.2843,20 60,20 L50,20 C44.4772,20 40,24.4772 40,30 C40,35.5228 44.4772,40 50,40 L60,40 C62.7614,40 65,37.7614 65,35 C65,32.2386 62.7614,30 60,30 L55,30" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
       <path d="M40,20 L30,20 C27.2386,20 25,22.2386 25,25 C25,27.7614 27.2386,30 30,30 L40,30 C45.5228,30 50,34.4772 50,40 L60,40 C62.7614,40 65,37.7614 65,35 C65,32.2386 62.7614,30 60,30 L50,30 C44.4772,30 40,25.5228 40,20 Z" fill="url(#linkGradientH)" opacity="0.7" />
      <circle cx="45" cy="30" r="3.5" fill="#10B981" filter="url(#glowH)" />
  </g>

  <g transform="translate(100, 22)">
    <text class="brand-text" font-size="34" x="0" y="24">SOLVIFY</text>
    <text class="tagline-text" font-size="13" x="0" y="45">Simplifying IT Solutions</text>
  </g>
</svg>